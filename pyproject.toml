[project]
name = "chess-dobot"
version = "0.1.0"
description = "A simulated Dobot Magician that plays chess with PyBullet, YOLO vision, and Stockfish"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chess>=1.11.2",
    "pybullet>=3.2.7",
    "pydobotlab>=0.2",
    "stockfish>=3.28.0",
    "ultralytics>=8.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.10",
]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that move the robot arm (~minutes)",
]
